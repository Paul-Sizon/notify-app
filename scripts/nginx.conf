# nginx reverse proxy for the notify Go backend.
# Listen on 8090, proxy → upstream Go on :8080.
# Why nginx in front: gives a stable hostname/port to expose via cloudflared
# tunnel; also lets us add gzip / TLS / rate limits later without touching Go.
worker_processes 1;
events { worker_connections 256; }

http {
    include       /opt/homebrew/etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    access_log /tmp/notify-nginx-access.log;
    error_log  /tmp/notify-nginx-error.log;

    upstream notify_go {
        server 127.0.0.1:8080;
        keepalive 16;
    }

    server {
        listen 8090;
        server_name _;

        # Cloudflared tunnels add their own X-Forwarded-* headers; preserve
        # the original client IP so server logs are useful.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Long agent runs (Brave + OpenAI) can take ~20s — bump default 60s
        # read timeout so /run never gets prematurely cut.
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    120s;

        location / {
            proxy_pass http://notify_go;
        }

        # Cheap liveness for cloudflared health checks.
        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }
    }
}
