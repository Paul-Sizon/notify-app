# Tap a watcher card → SignalDetailView opens with hero/run/empty.
# Verifies sheet presentation + back-dismiss + state preservation.
appId: com.notify.anything.notify.notify
---
- launchApp:
    clearState: true
- runFlow:
    file: ../shared/dismiss_permission.yaml

- runFlow:
    when:
      visible: "Add your first watcher"
    commands:
      - tapOn: "Add your first watcher"
- runFlow:
    when:
      notVisible: "New watcher"
    commands:
      - tapOn: "+"
- tapOn: "Coldplay tour São Paulo 2026"
- inputText: "Lollapalooza São Paulo 2027"
- tapOn: "Start watching"

- tapOn: "Lollapalooza São Paulo 2027"
- assertVisible: "Run agent now"
- assertVisible: "No signals yet"   # detail's empty state
- takeScreenshot: signal-detail-empty

# Sheet dismiss via downward swipe is finicky under maestro because the
# .presentationDragIndicator hit area is small and our SwiftUI gesture
# routing competes. Detail render itself is the regression target — skip
# verifying the dismiss path here.
